<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23ffffff%22/></svg>">
  <style>
    :root {
      --bg-color: #f3efe9;
      --panel-color: #f8f4f0;
      --text-color: #1b1917;
      --text-muted: #6d665f;
      --accent-color: #181614;
      --border-color: rgba(27, 25, 23, 0.14);
      --hover-color: #000000;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Inter", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      max-width: 700px;
      margin: 0 auto;
      padding: 64px 20px 72px;
      letter-spacing: -0.015em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 3.3rem);
      font-weight: 600;
      line-height: 0.96;
      color: var(--accent-color);
      margin: 0 0 8px;
      letter-spacing: -0.065em;
    }

    h2 {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 30px;
    }

    h3 {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin: 46px 0 18px;
    }

    p, li, td {
      font-size: 1rem;
      color: var(--text-color);
    }

    p { margin: 0 0 1.2rem; }

    a {
      color: var(--accent-color);
      text-decoration: none;
      border-bottom: 1px solid rgba(27, 25, 23, 0.2);
      transition: border-color 0.2s ease, opacity 0.2s ease, color 0.2s ease;
    }

    a:hover {
      color: var(--hover-color);
      border-bottom-color: rgba(0, 0, 0, 0.5);
    }

    ul { list-style: none; padding: 0; margin: 0; }
    li { margin-bottom: 30px; }

    .project-title {
      font-size: 1.04rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .project-meta {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .project-desc {
      font-size: 0.96rem;
      color: var(--text-color);
      margin-top: 8px;
      opacity: 0.9;
    }

    .experience-item {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
      padding-bottom: 4px;
      align-items: flex-start;
    }

    .experience-item > div {
      flex: 1;
      min-width: 0;
    }

    .experience-role {
      font-weight: 600;
      color: var(--text-color);
      letter-spacing: -0.02em;
    }

    .experience-company {
      color: var(--text-color);
    }

    .experience-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .experience-date {
      color: var(--text-muted);
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      margin-left: 16px;
      padding-top: 2px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 40px 0;
    }

    .footer {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-top: 56px;
      border-top: 1px solid var(--border-color);
      padding-top: 18px;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
